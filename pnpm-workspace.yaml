packages:
  - apps/*
  - packages/*
  - tooling/*

engineStrict: true
autoInstallPeers: true
strictPeerDependencies: true

catalog:
  "@playwright/test": ^1.65.0
  "@prisma/client": 7.10.1
  "@storybook/addon-a11y": ^10.6.6
  "@storybook/addon-docs": ^10.6.6
  "@storybook/nextjs-vite": ^10.6.6
  "@storybook/react-vite": ^10.6.6
  "@tailwindcss/postcss": ^4.3.4
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.8
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": ^6.2.1
  clsx: ^2.1.1
  dotenv: ^18.0.9
  eslint: ^9.39.5
  jsdom: ^31.0.0
  next: 16.4.5
  prisma: 7.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  server-only: ^0.0.1
  storybook: ^10.6.6
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.4
  tsx: ^4.23.15
  typescript: 5.9.3
  vitest: 5.0.5
  zod: ^4.6.7

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.9.17"
