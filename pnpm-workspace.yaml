  - "@turbo/linux-64@2.9.17"
  - "@turbo/linux-arm64@2.9.17"
  - "@turbo/windows-64@2.9.17"
  - "@turbo/windows-arm64@2.9.17"
  - turbo@2.9.17
  - "@playwright/test@1.65.0"
  - "@storybook/addon-a11y@10.6.6"
  - "@storybook/addon-docs@10.6.6"
  - "@storybook/builder-vite@10.6.6"
  - "@storybook/nextjs-vite@10.6.6"
  - "@storybook/react-dom-shim@10.6.6"
  - "@storybook/react-vite@10.6.6"
  - "@storybook/react@10.6.6"
  - jsdom@31.0.0
  - playwright-core@1.65.0
  - playwright@1.65.0
  - storybook@10.6.6
  - vite-plugin-storybook-nextjs@10.6.6
